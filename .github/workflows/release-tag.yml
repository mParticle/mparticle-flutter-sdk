name: Release – Tag

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions: {}

jobs:
  create-tag:
    runs-on: ubuntu-latest
    # Holds the release GitHub App credentials; its deployment rule admits main only.
    environment: release
    permissions:
      contents: read
    steps:
      # The tag is pushed with a GitHub App token, not GITHUB_TOKEN, so the push starts
      # Release – Publish (a tag pushed with GITHUB_TOKEN starts no workflow).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SDK_RELEASE_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mparticle-flutter-sdk
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] -- pushes the release tag; no build or package script runs in this job

      - name: Get version from file
        id: version-file
        run: |
          version_from_file=$(head -n 1 VERSION)
          echo "release-version=$version_from_file" >> $GITHUB_OUTPUT

      - name: Create and push tag
        env:
          RELEASE_VERSION: ${{ steps.version-file.outputs.release-version }}
        run: |
          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"
