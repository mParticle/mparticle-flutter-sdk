name: Release – Draft

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: Specify if the version should be bumped as patch, minor, or major
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The release PR is opened with the GitHub App token below, so GITHUB_TOKEN only reads.
permissions:
  contents: read
  pull-requests: read

jobs:
  publish-draft-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the release GitHub App credentials; its deployment rule admits main only.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get current version
        id: version-file
        run: |
          version_from_file=$(head -n 1 VERSION)
          echo "release-version=$version_from_file" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump-version
        uses: actions-ecosystem/action-bump-semver@34e334551143a5301f38c830e44a22273c6ff5c5 # v1
        with:
          current_version: ${{ steps.version-file.outputs.release-version }}
          level: ${{ github.event.inputs.bump-type || 'patch' }}

      - name: Generate changelog from merged PR titles
        id: changelog
        uses: ROKT/rokt-workflows/actions/generate-changelog@da0c5fd5d38e9cf113a24ec9aaea079cc7d0bc40 # main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: ${{ steps.bump-version.outputs.new_version }}
          tag-prefix: v
          changelog-path: CHANGELOG.md

      - name: Update release versions
        env:
          NEW_VERSION: ${{ steps.bump-version.outputs.new_version }}
        run: |
          printf '%s\n' "$NEW_VERSION" > VERSION
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Run dry-run publish
        run: |
          # `pub publish --dry-run` requires a clean git tree. This workflow
          # intentionally edits VERSION/pubspec/changelog before opening the PR,
          # so run the dry-run from a temporary copy without `.git`.
          temp_publish_dir="$(mktemp -d)"
          rsync -a --delete --exclude ".git" ./ "${temp_publish_dir}/"
          pushd "${temp_publish_dir}"
          flutter pub publish --dry-run
          popd

      # A short-lived GitHub App token, scoped to this repository, opens the release PR.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SDK_RELEASE_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mparticle-flutter-sdk
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          # The release PR changes only these files.
          add-paths: |
            VERSION
            pubspec.yaml
            CHANGELOG.md
          commit-message: "chore: Prepare release ${{ steps.bump-version.outputs.new_version }}"
          branch: release/${{ steps.bump-version.outputs.new_version }}
          title: "chore: Prepare release ${{ steps.bump-version.outputs.new_version }}"
          base: main
          body: |
            Preparing for release ${{ steps.bump-version.outputs.new_version }}
            - Updated pubspec.yaml to new version
            - Updated CHANGELOG.md
            - Updated VERSION file
            - Ran a dry-run publish

            ## Changelog
            ${{ steps.changelog.outputs.release-notes }}
          labels: |
            release
